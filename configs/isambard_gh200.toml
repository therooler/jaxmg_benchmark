[hardware]
gpu_name = "NVIDIA GH200 120GB"
# nvidia-smi on Isambard-AI Phase 2 reports 97871 MiB of visible HBM per GPU.
visible_memory_mib = 97871
allocator_fraction = 0.99
gpus_per_node = 4
# One GH200 superchip provides 72 CPU cores per GPU.
cpus_per_gpu = 72

[sweep]
routines = ["potrs", "lu_solve"]
dtypes = ["float32", "float64", "complex64", "complex128"]
tiles = [256, 512, 1024, 2048, 4096]
# Generate every non-transposed factor grid for 1, 2, 3, and 4 complete nodes.
node_counts = [1, 2, 3, 4]
# The planner uses these only below its case-specific 85% memory frontier.
# The final four values bridge naturally to larger multi-node configurations.
baseline_sizes = [512, 1024, 2048, 4096, 8192, 16384, 32768, 49152, 65536, 98304, 131072, 196608, 262144, 327680, 393216, 458752, 524288]
frontier_fractions = [0.85, 0.90, 0.92, 0.94, 0.96, 0.98, 0.99, 1.00]

[execution]
cold_runs = 1
warm_runs = 1
# A case contains one cold and one warm solve. One hour leaves room for two
# ~700-second solves and validation, while preventing a failed NCCL rank from
# consuming most of the outer 24-hour allocation.
case_timeout_seconds = 3600

[slurm]
# One outer job runs every selected matrix size and tile size for a single
# solver, dtype, and process-grid choice.
suite_walltime = "24:00:00"
# Host CPU RAM requested per node with `sbatch --mem`; this is not GPU HBM.
suite_memory = "400G"
