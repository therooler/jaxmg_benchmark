[hardware]
gpu_name = "NVIDIA H200"
# Replace this with the value reported by nvidia-smi on the target system.
visible_memory_mib = 143771
allocator_fraction = 0.99
gpus_per_node = 8
cpus_per_gpu = 16

[sweep]
# Supported routines are potrs, lu_solve, gesvd, and syevd.
routines = ["potrs", "lu_solve"]
dtypes = ["float32", "float64", "complex64", "complex128"]
tiles = [256, 512, 1024, 2048, 4096]
# Generate factor grids for 8, 16, 24, and 32 GPUs. Set explicit
# `grids = [...]` instead when a restricted topology is required.
node_counts = [1, 2, 3, 4]
baseline_sizes = [512, 1024, 2048, 4096, 8192, 16384, 32768, 49152, 65536, 98304, 131072, 196608, 262144, 327680, 393216, 458752, 524288, 589824, 655360, 720896, 786432, 851968, 917504, 983040, 1048576, 1179648]
frontier_fractions = [0.85, 0.90, 0.92, 0.94, 0.96, 0.98, 0.99, 1.00]

[execution]
cold_runs = 1
warm_runs = 1
case_timeout_seconds = 3600

[slurm]
# Maximum time for one complete routine/dtype/grid sweep.
suite_walltime = "24:00:00"
# Host CPU RAM requested per node with `sbatch --mem`; this is not GPU HBM.
suite_memory = "512G"
# Add site requirements when needed, for example:
# submit_args = ["--partition=gpu", "--account=my-project"]
